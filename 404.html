<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - Kaushik Tadepalli Portfolio">
    <title>404 - Page Not Found | Kaushik Tadepalli</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.png" type="image/png">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-size: clamp(4rem, 15vw, 10rem);
            font-weight: 900;
            color: var(--primary-color);
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: var(--text-color);
            margin-bottom: 2rem;
        }

        .error-description {
            font-size: 1.1rem;
            <div class="error-message">Page Not Found</div><p class="error-description">Oops ! The page you're looking for doesn' t exist. It might have been moved or deleted. </p><a href="index.html" class="home-link">Go Back Home</a></div></body></html>
